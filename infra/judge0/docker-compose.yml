# Self-hosted Judge0 CE: the code runner for Run, Submit and tier proofs. Copy judge0.conf.example to judge0.conf, fill every CHANGE_ME,
# then `docker compose up -d` on a dedicated Linux host (see docs/production-foundation.md for host requirements and the sandbox caveats).
# Never expose port 2358 to the internet: put it on a private network and let only the Capabilio server call it (JUDGE0_URL, JUDGE0_TOKEN).
services:
  server:
    build: .
    image: capabilio/judge0:1.13.1-modern
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    restart: always
    depends_on: [db, redis]
  worker:
    image: capabilio/judge0:1.13.1-modern
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on: [db, redis]
  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    env_file: judge0.conf
    restart: always
    depends_on: [server]
  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always
  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: always
volumes:
  postgres-data:
  caddy-data:
